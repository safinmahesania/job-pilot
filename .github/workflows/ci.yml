name: tests

# Runs the whole suite on every push and pull request. Until now the tests only ran
# when someone remembered to run them locally — which meant a fix could be green on
# the author's machine and broken on a fresh checkout, and three times it was (a .env
# leaking a password into the suite, a Windows file lock, a missing config file). CI
# runs against a clean clone every time, so those never reach main unnoticed again.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest

    # The suite is multi-user Postgres now, so it needs a real database. This spins up
    # a throwaway Postgres 16 for the job; conftest points DATABASE_URL at it, applies
    # the schema + auth shim, and TRUNCATEs between tests. It is wiped when the job ends,
    # so there is nothing to protect — JOBPILOT_ALLOW_TEST_DB=1 tells the guard as much.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_test
      JOBPILOT_ALLOW_TEST_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install the Calibri-metric font
        # The resume PDF is meant to come out in Calibri, or in Carlito — its metric
        # twin, same widths and line breaks. A bare runner has neither, so the renderer
        # falls back to DejaVu (correct behaviour) and the font assertion has nothing to
        # check. Installing Carlito means CI verifies the real guarantee instead of
        # skipping past it.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito

      - name: Run the test suite
        # TEST_DATABASE_URL points at the throwaway Postgres service above; conftest
        # bootstraps the schema and auth shim on first connect, so a clean, empty DB is
        # all that is needed. No .env exists, so the app still runs unlocked and every
        # endpoint is reachable, exactly as the tests expect.
        run: python -m pytest -p no:warnings

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Lint
        run: |
          pip install ruff
          python -m ruff check src/ || true

      - name: Type-check
        # Gradual typing: mypy.ini starts lenient and tightens as modules get typed.
        # This runs it so a regression in the checks that ARE on cannot land unnoticed.
        # It does not fail the build yet — the codebase still has known dynamic-JSON
        # findings — but it surfaces them on every push.
        run: python -m mypy src/ || true

  frontend:
    name: sanitizer test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jsdom
        run: npm install

      - name: Run the XSS sanitizer test
        run: npm test
